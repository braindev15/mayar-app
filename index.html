<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayar — Coming Soon</title>
  <meta name="description" content="Mayar — a baby care app for new mothers. Your baby's journey, beautifully tracked." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #f9d5e5;
      --lavender: #e3d4f4;
      --cream: #fff6ef;
      --rose: #f3b6c9;
      --plum: #6d5c7e;
      --text: #5a4a5f;
      --accent: #c98aa6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--cream) 0%, var(--pink) 45%, var(--lavender) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* soft floating blobs in the background */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }
    .blob.one {
      width: 360px; height: 360px;
      background: var(--rose);
      top: -120px; left: -100px;
    }
    .blob.two {
      width: 420px; height: 420px;
      background: var(--lavender);
      bottom: -160px; right: -120px;
    }
    .blob.three {
      width: 240px; height: 240px;
      background: #ffe7c2;
      top: 40%; right: 10%;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      padding: 56px 44px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(141, 110, 130, 0.22);
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--rose);
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 28px;
      box-shadow: 0 6px 16px rgba(201, 138, 166, 0.18);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(3.4rem, 12vw, 5.2rem);
      line-height: 1;
      color: var(--plum);
      letter-spacing: 0.01em;
      margin-bottom: 6px;
    }

    .heart {
      color: var(--rose);
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 4vw, 1.4rem);
      color: var(--text);
      margin-bottom: 14px;
    }

    .sub {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #7c6b80;
      max-width: 380px;
      margin: 0 auto 34px;
    }

    form {
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px;
      border-radius: 999px;
      box-shadow: inset 0 2px 6px rgba(141, 110, 130, 0.08);
      max-width: 420px;
      margin: 0 auto;
    }

    input[type="email"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 0.98rem;
      color: var(--text);
      border-radius: 999px;
    }

    input[type="email"]::placeholder {
      color: #b6a6ba;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      padding: 14px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--rose) 0%, var(--accent) 100%);
      box-shadow: 0 8px 20px rgba(201, 138, 166, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(201, 138, 166, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .footnote {
      margin-top: 22px;
      font-size: 0.82rem;
      color: #9a8a9e;
    }

    @media (max-width: 480px) {
      .card {
        padding: 44px 24px;
        border-radius: 26px;
      }
      form {
        flex-direction: column;
        border-radius: 24px;
        padding: 12px;
      }
      input[type="email"] {
        text-align: center;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <span class="badge">Coming Soon</span>
    <h1 class="logo">Mayar<span class="heart">.</span></h1>
    <p class="tagline">Your baby's journey, beautifully tracked.</p>
    <p class="sub">
      A gentle, thoughtful companion for new mothers — feeds, naps, milestones,
      and precious little moments, all in one calming place.
    </p>

    <form onsubmit="return false;">
      <input type="email" placeholder="Enter your email" aria-label="Email address" required />
      <button type="submit">Notify Me</button>
    </form>

    <p class="footnote">Be the first to know when Mayar arrives. 🤍</p>
  </main>
</body>
</html>
