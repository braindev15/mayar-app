<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayar — Coming Soon</title>
  <meta name="description" content="Mayar — a beautiful app to help new mothers track their baby's journey. Coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --lavender: #c7b8ea;
      --soft-pink: #f7c8d8;
      --mint: #b9e6d3;
      --ink: #4a4458;
      --muted: #7a7390;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #f3e9ff 0%, #ffe9f1 45%, #e4f7ee 100%);
      background-attachment: fixed;
      position: relative;
      overflow: hidden;
    }

    /* Soft floating blobs for a gentle, elegant backdrop */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
    }
    .blob.one {
      width: 360px; height: 360px;
      background: var(--lavender);
      top: -120px; left: -100px;
    }
    .blob.two {
      width: 320px; height: 320px;
      background: var(--soft-pink);
      bottom: -120px; right: -80px;
      animation-delay: 3s;
    }
    .blob.three {
      width: 280px; height: 280px;
      background: var(--mint);
      bottom: 10%; left: 8%;
      animation-delay: 6s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-24px) translateX(16px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 32px;
      padding: 56px 44px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(124, 102, 168, 0.22);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a6fc0;
      background: rgba(199, 184, 234, 0.32);
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--lavender), var(--soft-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 10px 24px rgba(199, 184, 234, 0.5);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.9rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: clamp(1rem, 3.5vw, 1.18rem);
      color: var(--muted);
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 36px;
    }

    form {
      display: flex;
      gap: 12px;
      max-width: 440px;
      margin: 0 auto;
    }

    input[type="email"] {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 1rem;
      padding: 15px 20px;
      border: 1.5px solid rgba(199, 184, 234, 0.55);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="email"]::placeholder { color: #a9a3bb; }
    input[type="email"]:focus {
      border-color: var(--lavender);
      box-shadow: 0 0 0 4px rgba(199, 184, 234, 0.25);
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      padding: 15px 26px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      background: linear-gradient(135deg, #b69bea, #f49ac0);
      box-shadow: 0 10px 22px rgba(180, 140, 220, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(180, 140, 220, 0.5);
      filter: brightness(1.03);
    }
    button:active { transform: translateY(0); }

    .note {
      margin-top: 18px;
      font-size: 0.86rem;
      color: #a39bb6;
      min-height: 1.2em;
      transition: color 0.2s;
    }
    .note.success { color: #4fae8c; font-weight: 600; }

    footer {
      margin-top: 34px;
      font-size: 0.82rem;
      color: #b0a9c2;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 26px; border-radius: 26px; }
      form { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <span class="badge">Coming Soon</span>
    <div class="logo" aria-hidden="true">🍼</div>
    <h1>Mayar — Coming Soon</h1>
    <p class="tagline">A beautiful app to help new mothers track their baby's journey — feedings, sleep, milestones, and precious moments, all in one gentle place.</p>

    <form id="signup" novalidate>
      <input type="email" id="email" name="email" placeholder="Enter your email" aria-label="Email address" required />
      <button type="submit">Notify Me</button>
    </form>
    <p class="note" id="note" role="status" aria-live="polite">Be the first to know when we launch. 💜</p>

    <footer>© 2026 Mayar · Made with love for new mothers</footer>
  </main>

  <script>
    const form = document.getElementById('signup');
    const email = document.getElementById('email');
    const note = document.getElementById('note');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const value = email.value.trim();
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      if (!valid) {
        note.textContent = 'Please enter a valid email address.';
        note.classList.remove('success');
        email.focus();
        return;
      }
      note.textContent = "Thank you! We'll let you know the moment Mayar is ready. 🎉";
      note.classList.add('success');
      form.reset();
    });
  </script>
</body>
</html>
